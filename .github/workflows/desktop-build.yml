name: Build Desktop Installers

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows .exe installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Enable and scaffold Windows
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows .

      - name: Build Windows app
        run: flutter build windows --release

      - name: Compile Inno Setup script
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.5
        with:
          path: packaging/windows/prono.iss

      - name: Verify installer output
        shell: pwsh
        run: |
          if (!(Test-Path "dist/windows/prono-windows-setup.exe")) {
            Write-Error "Installer not found at dist/windows/prono-windows-setup.exe"
          }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: prono-windows-installer-exe
          path: dist/windows/prono-windows-setup.exe

  build-macos:
    name: Build macOS drag-and-drop .dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Enable and scaffold macOS
        run: |
          flutter config --enable-macos-desktop
          flutter create --platforms=macos .

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Precache macOS artifacts
        run: flutter precache --macos

      - name: Build macOS app (no codesign in CI)
        run: flutter build macos --release --no-codesign -v

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build drag-and-drop DMG
        run: |
          mkdir -p dist
          create-dmg \
            --overwrite \
            --volname "Prono" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "prono.app" 200 190 \
            --hide-extension "prono.app" \
            --app-drop-link 600 185 \
            "dist/prono-macos.dmg" \
            "build/macos/Build/Products/Release/"

      - name: Verify DMG output
        run: test -f dist/prono-macos.dmg

      - name: Upload macOS dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: prono-macos-dmg
          path: dist/prono-macos.dmg
