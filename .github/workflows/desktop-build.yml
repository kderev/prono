name: Build Desktop Installers

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows .exe installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Enable and scaffold Windows
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows .

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Windows app
        run: flutter build windows --release -v

      - name: Compile Inno Setup script
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.5
        with:
          path: packaging/windows/prono.iss

      - name: Verify installer output
        shell: pwsh
        run: |
          if (!(Test-Path "dist/windows/prono-windows-setup.exe")) {
            Write-Error "Installer not found at dist/windows/prono-windows-setup.exe"
          }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: prono-windows-installer-exe
          path: dist/windows/prono-windows-setup.exe

  build-macos:
    name: Build macOS drag-and-drop .dmg
    runs-on: macos-latest
    env:
      APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Enable and scaffold macOS
        run: |
          flutter config --enable-macos-desktop
          flutter create --platforms=macos .

      - name: Resolve dependencies
        run: flutter pub get

      - name: Precache macOS artifacts
        run: flutter precache --macos

      - name: Import Apple certificate (optional)
        if: env.APPLE_CERT_BASE64 != '' && env.APPLE_CERT_PASSWORD != ''
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          echo "$APPLE_CERT_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN_PATH"

      - name: Build macOS app
        run: |
          set -euo pipefail
          if [ -n "${APPLE_CERT_BASE64}" ] && [ -n "${APPLE_CERT_PASSWORD}" ]; then
            flutter build macos --release -v
          else
            flutter build macos --release --no-codesign -v
          fi

      - name: Codesign .app (optional)
        if: env.APPLE_CERT_BASE64 != '' && env.APPLE_CERT_PASSWORD != ''
        run: |
          set -euo pipefail
          APP_PATH="$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)"
          IDENTITY="$(security find-identity -v -p codesigning | awk -F\" '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo "No 'Developer ID Application' identity found in keychain"
            security find-identity -v -p codesigning
            exit 1
          fi
          /usr/bin/codesign --force --options runtime --deep --sign "$IDENTITY" "$APP_PATH"
          /usr/bin/codesign --verify --verbose=2 "$APP_PATH"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build drag-and-drop DMG
        run: |
          set -euo pipefail
          mkdir -p dist
          APP_PATH="$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in build/macos/Build/Products/Release"
            ls -la build/macos/Build/Products/Release || true
            exit 1
          fi
          APP_NAME="$(basename "$APP_PATH")"
          echo "Using app bundle: $APP_NAME"
          create-dmg \
            --overwrite \
            --volname "Prono" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "$APP_NAME" 200 190 \
            --hide-extension "$APP_NAME" \
            --app-drop-link 600 185 \
            "dist/prono-macos.dmg" \
            "build/macos/Build/Products/Release/"

      - name: Codesign DMG (optional)
        if: env.APPLE_CERT_BASE64 != '' && env.APPLE_CERT_PASSWORD != ''
        run: |
          set -euo pipefail
          IDENTITY="$(security find-identity -v -p codesigning | awk -F\" '/Developer ID Application/ {print $2; exit}')"
          /usr/bin/codesign --force --sign "$IDENTITY" "dist/prono-macos.dmg"
          /usr/bin/codesign --verify --verbose=2 "dist/prono-macos.dmg"

      - name: Notarize DMG (optional)
        if: env.APPLE_CERT_BASE64 != '' && env.APPLE_CERT_PASSWORD != '' && env.APPLE_ID != '' && env.APP_SPECIFIC_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        run: |
          set -euo pipefail
          xcrun notarytool submit "dist/prono-macos.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "dist/prono-macos.dmg"
          xcrun stapler validate "dist/prono-macos.dmg"

      - name: Verify DMG output
        run: test -f dist/prono-macos.dmg

      - name: Upload macOS dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: prono-macos-dmg
          path: dist/prono-macos.dmg

  publish-macos-release:
    name: Publish macOS DMG to GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-macos
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: prono-macos-dmg
          path: release-assets

      - name: Prepare release tag name
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "name=desktop-latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish macOS DMG
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Desktop installers (${{ steps.tag.outputs.name }})
          generate_release_notes: true
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: |
            release-assets/prono-macos.dmg

  publish-windows-release:
    name: Publish Windows installer to GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-windows
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: prono-windows-installer-exe
          path: release-assets

      - name: Prepare release tag name
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "name=desktop-latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Windows installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Desktop installers (${{ steps.tag.outputs.name }})
          generate_release_notes: true
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: |
            release-assets/prono-windows-setup.exe
